[package]
name = "wmde-taskmgr"
version = "1.10.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[dependencies]
# Sending a signal to another process. std has no kill, and rustix is already in the graph.
rustix = { version = "1.1", features = ["process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.15.0", default-features = false, features = ["tokio"] }
# A runtime for the single-instance check, which runs before the toolkit starts one.
tokio = { version = "1", features = ["rt", "sync", "macros"] }

# Interface text. Ukrainian and English only - the stack has no Russian locale, and the
# build gate in build-packages.sh fails if an i18n/ru* directory appears.
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"

# Load sampling and the graph widget, shared with the panel's system monitor applet. Taken
# by path across forks, the way wmde-term takes wmde-files.
wmde-sysmon = { path = "../wmde-applets/wmde-sysmon" }

# The memory module report, written by the wmde-memory-devices collector and read by the
# window. RON because the rest of the stack speaks it; both crates are already in the graph
# through cosmic-config, so this adds nothing to build.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

[dependencies.libcosmic]
path = "../libcosmic"
default-features = false
features = [
    "about",
    "autosize",
    "multi-window",
    "tokio",
    "winit",
    "surface-message",
]

[features]
default = ["dbus-config", "wgpu", "wayland"]
dbus-config = ["libcosmic/dbus-config"]
wgpu = ["libcosmic/wgpu"]
wayland = ["libcosmic/wayland"]

# Build libcosmic and iced from the local WMDE fork, so the rebranded config root and the
# fun.wmde.* theme ids resolve. ONE table per canonical git source: cargo folds the
# `.../libcosmic`, `.../libcosmic/` and `.../libcosmic.git` spellings into a single source,
# and a second table for it does not add to this one - part of the graph would silently
# resolve to upstream with no warning and no error.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

# WMDE: redirect the panel config crate to the local wmde-panel fork. wmde-sysmon brings
# libcosmic's applet feature, and with it cosmic-panel-config by git.
[patch."https://github.com/pop-os/cosmic-panel"]
cosmic-panel-config = { path = "../wmde-panel/cosmic-panel-config" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
